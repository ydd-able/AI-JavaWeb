<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-函数</title>
</head>
<body>
  

  <script>
      //函数的定义及调用。
      function add(a,b){
        return a+b;
      }
      let result = add(10,20);
      console.log(result);
      
      //匿名函数
      let add = (a,b)=>{
        return a+b;
      }
      let result1 = add(10,20);

  </script>
</body>
</html>
