<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax-Axios</title>
</head>
<body>
    
    <input type="button" value="获取数据GET" id="btnGet">
    <input type="button" value="操作数据POST" id="btnPost">

    <script src="js/axios.js"></script>
    <script>
        //发送GET请求
        document.querySelector('#btnGet').addEventListener('click', () => {
           //axios发起异步请求。
           axios({
            url:'https://mock.apifox.cn/ml/3083103-0-default/emps/list',
            method:'get'
           }).then((result)=>{
            console.log(result)
           }).catch((error)=>{
            console.log(error)
           })
        })
        
        //发送POST请求
        document.querySelector('#btnPost').addEventListener('click', () => {
            axios({
            url:'https://mock.apifox.cn/ml/3083103-0-default/emps/update',
            method:'post',
            data:{
                id:1
            }
           }).then((result)=>{
            console.log(result)
           }).catch((error)=>{
            console.log(error)
           })
        })
    </script>
</body>
</html>
