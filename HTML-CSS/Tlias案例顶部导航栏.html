<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tlias智能学习辅助系统</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 顶栏整体 */
        .top-bar {
            width: 100%;
            height: 60px;
            background-color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        /* 左侧标题 */
        .top-bar .title {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            /* 字体设置为楷体 */
            font-family: "楷体";
        }

        /* 右侧退出登录 */
        .top-bar .logout {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
        }

        .top-bar .logout:hover {
            color: #e74c3c;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- ==================== 第一部分：顶栏 ==================== -->
    <div class="top-bar">
        <!-- 左侧：系统标题 -->
        <span class="title">Tlias智能学习辅助系统</span>
        <!-- 右侧：退出登录 -->
        <a href="#" class="logout">退出登录</a>
    </div>

</body>
</html>
